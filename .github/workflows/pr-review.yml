name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize]
jobs:
  review:
    runs-on: ubuntu-latest
    permissions: 
         pull-requests: write 
         contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Run code review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          git diff origin/master...HEAD > diff.txt
          cat diff.txt | claude --bare -p \
            "Review this diff for bugs, security issues, and style problems.
             Format as markdown with sections for each issue found." \
            --allowedTools "Read" \
            --max-budget-usd 2 \
            --output-format json | jq -r '.result' > review.md
      - name: Post review as PR comment
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file review.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
